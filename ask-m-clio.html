<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask M.CLIO | Muhammad Clinic Voice Assistant</title>
    <link rel="shortcut icon" type="image/png" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; padding: 40px 20px; }
        
        /* Top Navigation Bar */
        .top-nav { max-width: 650px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
        .back-link { text-decoration: none; color: #004d40; font-weight: 600; font-size: 0.9rem; background: #ffffff; padding: 8px 18px; border-radius: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #cbd5e1; transition: all 0.3s; }
        .back-link:hover { background: #004d40; color: #ffffff; }

        .clio-container { max-width: 650px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 5px solid #004d40; text-align: center; }
        h1 { color: #004d40; margin-bottom: 10px; font-size: 1.8rem; }
        p.sub { color: #64748b; margin-bottom: 30px; font-size: 0.95rem; }
        
        .mic-box { background: #e0f2f1; border: 2px dashed #80cbc4; padding: 30px; border-radius: 10px; margin-bottom: 25px; }
        .mic-box p { color: #004d40; font-weight: 500; margin-bottom: 15px; font-size: 1.05rem; }
        
        /* Vapi Widget Container Styling */
        #vapi-support-container { display: flex; justify-content: center; margin-top: 20px; }

        .fallback-contact { margin-top: 30px; font-size: 0.85rem; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .fallback-contact a { color: #004d40; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="index.html" class="back-link">← Back to Home</a>
</div>

<div class="clio-container">
    <h1>Meet M.CLIO</h1>
    <p class="sub">Your 24/7 AI Voice Assistant for Muhammad Clinic, Township, Lahore</p>

    <div class="mic-box">
        <p>🎙️ Talk directly with M.CLIO to inquire about doctors, timings, consultation fees, or book your appointment by voice.</p>
        
        <!-- Vapi Button Widget Mount Point -->
        <div id="vapi-support-container"></div>
    </div>

    <div class="fallback-contact">
        <p>Prefer speaking to our clinic manager directly? Call or WhatsApp us at <a href="https://wa.me/923351703379">03351703379</a>.</p>
    </div>
</div>

<!-- Vapi Web SDK Initialization Script -->
<script>
  // Replace YOUR_VAPI_PUBLIC_KEY and YOUR_ASSISTANT_ID with your actual Vapi credentials
  var vapiInstance = null;
  const VAPI_CONFIG = {
    apiKey: "YOUR_VAPI_PUBLIC_KEY", 
    assistant: "YOUR_ASSISTANT_ID"
  };

  // Load Vapi Widget Script Dynamically
  (function () {
    var script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
    script.defer = true;
    script.async = true;
    script.onload = function () {
      window.vapiSDK.run({
        apiKey: VAPI_CONFIG.apiKey,
        assistant: VAPI_CONFIG.assistant,
        config: {
          buttonPosition: "bottom-right",
          buttonColor: "#004d40",
          buttonText: "Talk with M.CLIO"
        }
      });
    };
    document.head.appendChild(script);
  })();
</script>

</body>
</html>
