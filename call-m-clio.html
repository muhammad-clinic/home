<script>
      const VAPI_CONFIG = {
        apiKey: "1102a857-9bb8-4e5f-8af6-3a6781fe0562",
        assistant: "99837d2f-3d5a-4688-beab-29070d723d34"
      };

      let vapiInstance = null;

      (function () {
        var script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        script.defer = true;
        script.async = true;
        script.onload = function () {
          // Initialize Vapi SDK and capture the returned instance
          vapiInstance = window.vapiSDK.run({
            apiKey: VAPI_CONFIG.apiKey,
            assistant: VAPI_CONFIG.assistant,
            config: {
              buttonPosition: "bottom-right",
              buttonColor: "#004d40",
              buttonText: "Call M.CLIO Live"
            }
          });

          setupVapiListeners();
        };
        document.head.appendChild(script);
      })();

      function setupVapiListeners() {
        const chatLog = document.getElementById("chatLog");
        const statusLabel = document.getElementById("callStatus");

        // Polling check to ensure vapiInstance or global event handler is ready
        const checkInterval = setInterval(() => {
          if (window.vapiSDK) {
            // Listen to call connection status events
            window.vapiSDK.on("call-start", () => {
              statusLabel.innerText = "Status: Connected 🟢";
              statusLabel.style.color = "#16a34a";
              chatLog.innerHTML = ""; 
            });

            window.vapiSDK.on("call-end", () => {
              statusLabel.innerText = "Status: Disconnected ⚫";
              statusLabel.style.color = "#64748b";
            });

            // Capture live speech transcripts
            window.vapiSDK.on("message", (message) => {
              if (message) {
                // Handle Vapi transcript message structures
                if (message.type === "transcript" && message.transcript) {
                  appendMessage(message.role || "assistant", message.transcript);
                } else if (message.message && message.message.type === "transcript") {
                  appendMessage(message.message.role, message.message.transcript);
                }
              }
            });

            clearInterval(checkInterval);
          }
        }, 500);
      }

      function appendMessage(role, text) {
        const chatLog = document.getElementById("chatLog");
        if (chatLog.innerHTML.includes("Start a voice call")) {
          chatLog.innerHTML = "";
        }
        
        // Prevent duplicate consecutive entries
        const lastChild = chatLog.lastElementChild;
        if (lastChild && lastChild.innerText.includes(text)) {
          return;
        }

        const div = document.createElement("div");
        div.className = `chat-message ${role === "user" ? "user" : "assistant"}`;
        let senderLabel = role === "user" ? "You" : "M.CLIO";
        div.innerHTML = `<span>${senderLabel}</span>${text}`;
        chatLog.appendChild(div);
        chatLog.scrollTop = chatLog.scrollHeight;
      }
    </script>
